<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Penalty Shootout</title>
  <style>
    :root {
      --bg: #070a16;
      --panel: #11162b;
      --text: #f4f6ff;
      --muted: #b8c0e3;
      --accent: #4df5c5;
      --danger: #ff6b6b;
      --pitch: #1f8a47;
      --pitch-dark: #16693a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(55, 64, 105, 0.8), rgba(6, 8, 20, 0.92)),
        linear-gradient(160deg, #05060e, #090c1b 60%, #040508);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      padding: 16px;
    }

    .shootout-shell {
      width: min(96vw, 560px);
      background: color-mix(in oklab, var(--panel), black 18%);
      border-radius: 18px;
      border: 1px solid #2d3561;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .eyebrow {
      margin: 0;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    h1 {
      margin: 6px 0 4px;
      font-size: 1.6rem;
    }

    .sub {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    button {
      border: 1px solid #39457a;
      border-radius: 12px;
      background: linear-gradient(180deg, #202a56, #121831);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .small-btn {
      padding: 8px 12px;
      font-size: 0.8rem;
    }

    .opponent-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: #10162c;
      border-radius: 14px;
      border: 1px solid #2c3560;
    }

    .opponent-card h2 {
      margin: 6px 0 4px;
      font-size: 1.2rem;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .opponent-team {
      margin: 0;
      color: #d2d8f4;
      font-size: 0.9rem;
    }

    .opponent-logo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #1d2444;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
    }

    .game-field {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: linear-gradient(180deg, var(--pitch), var(--pitch-dark));
      border-radius: 16px;
      border: 1px solid #2c3560;
      overflow: hidden;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.4);
    }

    .game-field::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.08) 0,
        rgba(255, 255, 255, 0.08) 2px,
        transparent 2px,
        transparent 24px
      );
      opacity: 0.35;
    }

    .goal-frame {
      position: absolute;
      top: 6%;
      left: 10%;
      width: 80%;
      height: 30%;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .goal-frame::after {
      content: "";
      position: absolute;
      inset: 10% 12% 0 12%;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      border-bottom: none;
    }

    .goalie,
    .ball {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 0);
      transition: transform 0.65s ease;
      z-index: 2;
    }

    .goalie {
      bottom: 42%;
      font-size: 3rem;
    }

    .ball {
      bottom: 16%;
      font-size: 2.4rem;
    }

    .ball.shot-left {
      transform: translate(-180%, -220%);
    }

    .ball.shot-center {
      transform: translate(-50%, -235%);
    }

    .ball.shot-right {
      transform: translate(80%, -220%);
    }

    .goalie.dive-left {
      transform: translate(-170%, -15%);
    }

    .goalie.dive-center {
      transform: translate(-50%, -25%) scale(1.05);
    }

    .goalie.dive-right {
      transform: translate(70%, -15%);
    }

    .status-panel {
      min-height: 72px;
      text-align: center;
      display: grid;
      gap: 4px;
    }

    .status-text {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .result-text {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .result-text.goal {
      color: var(--accent);
    }

    .result-text.save {
      color: var(--danger);
    }

    .cpu-text {
      margin: 0;
      color: #d6dcfa;
      font-size: 0.9rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .direction-btn {
      padding: 14px 10px;
      font-size: 1rem;
      border-radius: 14px;
    }

    .primary-btn {
      padding: 14px;
      font-size: 1rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #4df5c5, #44a3ff);
      color: #04131b;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (prefers-reduced-motion: reduce) {
      .goalie,
      .ball,
      button {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="shootout-shell">
    <header class="top">
      <div>
        <p class="eyebrow">Ultimate Football Game</p>
        <h1>Penalty Shootout</h1>
        <p class="sub">Pick a direction and beat the keeper.</p>
      </div>
      <button id="newKeeperBtn" class="small-btn" type="button">New Keeper</button>
    </header>

    <section class="opponent-card" aria-live="polite">
      <div>
        <span class="label">Opponent Goalkeeper</span>
        <h2 id="keeperName">Loading...</h2>
        <p id="keeperTeam" class="opponent-team">Fetching team...</p>
      </div>
      <div class="opponent-logo" aria-hidden="true">🧤</div>
    </section>

    <section id="gameField" class="game-field" role="img" aria-label="Penalty area">
      <div class="goal-frame" aria-hidden="true"></div>
      <div id="goalie" class="goalie" aria-hidden="true">🧤</div>
      <div id="ball" class="ball" aria-hidden="true">⚽</div>
    </section>

    <div class="status-panel">
      <p id="statusText" class="status-text">Loading player data…</p>
      <p id="resultText" class="result-text" aria-live="polite"></p>
      <p id="cpuText" class="cpu-text"></p>
    </div>

    <div class="controls" role="group" aria-label="Choose shooting direction">
      <button class="direction-btn" data-direction="Left" type="button">Left</button>
      <button class="direction-btn" data-direction="Center" type="button">Center</button>
      <button class="direction-btn" data-direction="Right" type="button">Right</button>
    </div>

    <button id="startBtn" class="primary-btn" type="button">Start Shootout</button>
  </main>

  <script>
    (() => {
      'use strict';

      const API_URL = 'https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=Messi';
      const directions = ['Left', 'Center', 'Right'];

      const keeperNameEl = document.getElementById('keeperName');
      const keeperTeamEl = document.getElementById('keeperTeam');
      const statusText = document.getElementById('statusText');
      const resultText = document.getElementById('resultText');
      const cpuText = document.getElementById('cpuText');
      const startBtn = document.getElementById('startBtn');
      const newKeeperBtn = document.getElementById('newKeeperBtn');
      const ball = document.getElementById('ball');
      const goalie = document.getElementById('goalie');
      const directionButtons = Array.from(document.querySelectorAll('.direction-btn'));

      const gameState = {
        loading: true,
        menu: false,
        playing: false,
        result: false,
        opponentList: [],
        opponent: null,
        playerChoice: null,
        cpuChoice: null,
        outcome: '',
        notice: '',
      };

      const shotClasses = ['shot-left', 'shot-center', 'shot-right'];
      const diveClasses = ['dive-left', 'dive-center', 'dive-right'];

      function setState(next) {
        gameState.loading = next === 'loading';
        gameState.menu = next === 'menu';
        gameState.playing = next === 'playing';
        gameState.result = next === 'result';
        updateUI();
      }

      function updateUI() {
        directionButtons.forEach((btn) => {
          btn.disabled = !gameState.playing;
        });

        newKeeperBtn.disabled = gameState.loading || gameState.playing || !gameState.opponentList.length;

        if (gameState.loading) {
          statusText.textContent = 'Loading player data…';
          startBtn.hidden = true;
        } else if (gameState.menu) {
          statusText.textContent = gameState.notice || 'Ready to shoot? Choose a direction.';
          startBtn.hidden = false;
          startBtn.textContent = 'Start Shootout';
        } else if (gameState.playing) {
          statusText.textContent = 'Pick Left, Center, or Right to shoot.';
          startBtn.hidden = true;
        } else if (gameState.result) {
          statusText.textContent = 'Result in!';
          startBtn.hidden = false;
          startBtn.textContent = 'Shoot Again';
        }

        if (gameState.result) {
          resultText.textContent = gameState.outcome;
          resultText.classList.toggle('goal', gameState.outcome === 'GOAL!');
          resultText.classList.toggle('save', gameState.outcome === 'SAVED!');
          cpuText.textContent = `Goalie dives ${gameState.cpuChoice}.`;
        } else {
          resultText.textContent = '';
          resultText.classList.remove('goal', 'save');
          cpuText.textContent = '';
        }
      }

      function updateOpponent(player) {
        const name = player?.strPlayer?.trim() || 'Mystery Keeper';
        const team = player?.strTeam?.trim() || 'Unknown Club';
        keeperNameEl.textContent = name;
        keeperTeamEl.textContent = `Team: ${team}`;
        gameState.opponent = player || null;
      }

      function pickOpponent() {
        const players = gameState.opponentList;
        if (!players.length) {
          updateOpponent(null);
          return;
        }

        const keepers = players.filter((player) =>
          String(player?.strPosition || '').toLowerCase().includes('goalkeeper')
        );
        const pool = keepers.length ? keepers : players;
        const selection = pool[Math.floor(Math.random() * pool.length)];
        updateOpponent(selection);
      }

      async function loadOpponents() {
        setState('loading');
        gameState.notice = '';

        try {
          const response = await fetch(API_URL);
          if (!response.ok) {
            throw new Error('Failed to load player data.');
          }
          const data = await response.json();
          const players = Array.isArray(data?.player) ? data.player : [];
          gameState.opponentList = players;
          pickOpponent();
          setState('menu');
        } catch (error) {
          console.error(error);
          gameState.opponentList = [];
          updateOpponent(null);
          gameState.notice = 'Unable to reach the API. Using a local keeper instead.';
          setState('menu');
        }
      }

      function resetShot() {
        ball.classList.remove(...shotClasses);
        goalie.classList.remove(...diveClasses);
      }

      function animateShot(playerChoice, cpuChoice) {
        resetShot();
        void ball.offsetWidth;
        ball.classList.add(`shot-${playerChoice.toLowerCase()}`);
        goalie.classList.add(`dive-${cpuChoice.toLowerCase()}`);
      }

      function handleShot(direction) {
        if (!gameState.playing) {
          return;
        }

        const cpuChoice = directions[Math.floor(Math.random() * directions.length)];
        gameState.playerChoice = direction;
        gameState.cpuChoice = cpuChoice;
        gameState.outcome = direction !== cpuChoice ? 'GOAL!' : 'SAVED!';
        animateShot(direction, cpuChoice);
        setState('result');
      }

      directionButtons.forEach((button) => {
        button.addEventListener('click', () => {
          handleShot(button.dataset.direction);
        });
      });

      startBtn.addEventListener('click', () => {
        resetShot();
        gameState.outcome = '';
        gameState.cpuChoice = null;
        gameState.playerChoice = null;
        setState('playing');
      });

      newKeeperBtn.addEventListener('click', () => {
        pickOpponent();
      });

      loadOpponents();
    })();
  </script>
</body>
</html>
