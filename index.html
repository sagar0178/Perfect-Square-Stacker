<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfect Square Stacker</title>
  <style>
    :root {
      --bg-hue: 230;
      --panel: #111325;
      --text: #f1f4ff;
      --accent: #5df2ff;
      --danger: #ff5da2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 10%, hsl(var(--bg-hue) 70% 22%), #07070f 65%),
        linear-gradient(
          120deg,
          hsl(calc(var(--bg-hue) + 40) 65% 16% / 0.85),
          hsl(calc(var(--bg-hue) + 140) 70% 18% / 0.8)
        );
      background-size: 200% 200%;
      animation: gradient-shift 18s ease infinite;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: background 0.35s ease;
      padding: 16px;
    }

    .game-shell {
      width: min(94vw, 390px);
      background: color-mix(in oklab, var(--panel), black 12%);
      border: 1px solid #2f355f;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 14px 36px rgb(0 0 0 / 45%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .scores {
      display: flex;
      gap: 12px;
      font-size: 0.96rem;
    }

    .scores strong { color: var(--accent); }
    #score { display: inline-block; }

    #score.score-pop {
      animation: score-pop 0.35s ease;
      transform-origin: center;
    }

    button {
      border: 1px solid #36408a;
      border-radius: 9px;
      padding: 8px 12px;
      color: var(--text);
      background: linear-gradient(180deg, #252f66, #19204a);
      cursor: pointer;
      font-weight: 700;
      animation: breathe 3.2s ease-in-out infinite;
      transform-origin: center;
    }

    button:focus-visible,
    .game-area:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .game-area {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 5;
      border-radius: 12px;
      border: 1px solid #2e3260;
      background: linear-gradient(180deg, rgb(21 23 42 / 92%), rgb(11 12 24 / 98%));
      overflow: hidden;
      touch-action: manipulation;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .game-shell.fever {
      border-color: color-mix(in oklab, var(--accent), white 25%);
      box-shadow:
        0 0 22px rgb(255 232 150 / 40%),
        0 16px 36px rgb(0 0 0 / 55%);
      animation: fever-pulse 1.6s ease-in-out infinite;
    }

    .game-area.fever {
      border-color: color-mix(in oklab, var(--accent), white 20%);
      box-shadow: inset 0 0 18px rgb(93 242 255 / 30%);
    }

    .game-area.shake {
      animation: shake 0.18s linear;
    }

    .block {
      position: absolute;
      height: 32px;
      border-radius: 6px 6px 0 0;
      box-shadow: 0 0 14px rgb(93 242 255 / 34%);
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.9;
      animation: particle 0.7s ease-out forwards;
      mix-blend-mode: screen;
    }

    .message {
      min-height: 1.3em;
      text-align: center;
      color: #b7beff;
      font-size: 0.95rem;
    }

    .hint {
      margin: 0;
      text-align: center;
      color: #a9afd8;
      font-size: 0.85rem;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    @keyframes score-pop {
      0% { transform: scale(1); }
      35% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes particle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.1); opacity: 0; }
    }

    @keyframes fever-pulse {
      0%, 100% { box-shadow: 0 0 16px rgb(255 232 150 / 35%), 0 16px 36px rgb(0 0 0 / 55%); }
      50% { box-shadow: 0 0 28px rgb(93 242 255 / 45%), 0 18px 40px rgb(0 0 0 / 55%); }
    }

    @media (prefers-reduced-motion: reduce) {
      body { transition: none !important; animation: none !important; }
      .game-area.shake { animation: none !important; }
      .game-shell.fever { animation: none !important; }
      button { animation: none !important; }
      #score.score-pop { animation: none !important; }
      .particle { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <div class="hud">
      <div class="scores" aria-label="scoreboard">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <button id="startBtn" type="button" aria-label="Start or restart game">Start Game</button>
    </div>

    <section
      id="gameArea"
      class="game-area"
      role="application"
      aria-label="Perfect Square Stacker game area. Tap, click, Enter, or Space to drop the moving block."
      tabindex="0"
    ></section>

    <p id="message" class="message" aria-live="polite">Press Start to begin.</p>
    <p class="hint">Tap/click game area (or press Enter/Space) to drop each block.</p>
  </main>

  <script>
    (() => {
      'use strict';

      const gameArea = document.getElementById('gameArea');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const messageEl = document.getElementById('message');
      const startBtn = document.getElementById('startBtn');
      const gameShell = document.querySelector('.game-shell');

      const MAX_DELTA_SECONDS = 0.033;
      const MAX_BLOCK_SPEED = 360;
      const FEVER_STREAK = 3;
      const FEVER_DURATION = 4500;
      const PARTICLE_COUNT_RANGE = [10, 15];
      const PALETTE = [200, 220, 245, 270, 295, 325, 350, 15, 45, 70];
      const BASE_HUE = 220;
      const HUE_INCREMENT = 9;
      const PALETTE_HUE_MULTIPLIER = 7;
      const FREQUENCY_SCORE_MULTIPLIER = 6;
      const AUDIO_MASTER_GAIN = 0.08;
      const HAPTIC_IMPACT_PATTERN = [200];
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const parsedBest = Number.parseInt(localStorage.getItem('pss-best') || '0', 10);
      const safeBest = Number.isNaN(parsedBest) ? 0 : parsedBest;

      const GameStates = Object.freeze({
        MENU: 'MENU',
        PLAYING: 'PLAYING',
        LEVEL_UP: 'LEVEL_UP',
        GAME_OVER: 'GAME_OVER',
      });

      const state = {
        running: false,
        animationId: 0,
        lastTime: 0,
        score: 0,
        best: safeBest,
        stack: [],
        current: null,
        dimensions: { width: 0, height: 0 },
        blockHeight: 32,
        gameState: GameStates.MENU,
        perfectStreak: 0,
        feverActive: false,
        feverEndsAt: 0,
      };

      const audioState = {
        ctx: null,
        master: null,
      };

      bestEl.textContent = String(state.best);

      scoreEl.addEventListener('animationend', (event) => {
        if (event.animationName === 'score-pop') {
          scoreEl.classList.remove('score-pop');
        }
      });

      function setMessage(text, isError = false) {
        messageEl.textContent = text;
        messageEl.style.color = isError ? 'var(--danger)' : '#b7beff';
      }

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function updateBackground() {
        const hue = (BASE_HUE + state.score * HUE_INCREMENT) % 360;
        document.documentElement.style.setProperty('--bg-hue', String(hue));
      }

      function paletteColor(index, shift = 0) {
        const hueShift = (state.score * PALETTE_HUE_MULTIPLIER + shift) % 360;
        const hue = (PALETTE[index % PALETTE.length] + hueShift) % 360;
        return `hsl(${hue} 85% 62%)`;
      }

      function createBlockElement(block, level) {
        const el = document.createElement('div');
        el.className = 'block';
        el.style.width = `${block.width}px`;
        el.style.left = `${block.x}px`;
        el.style.bottom = `${block.y}px`;
        el.style.background = paletteColor(level);
        gameArea.appendChild(el);
        block.el = el;
      }

      function burstParticles(x, y, level) {
        if (prefersReducedMotion) {
          return;
        }

        const count = randomInt(PARTICLE_COUNT_RANGE[0], PARTICLE_COUNT_RANGE[1]);

        for (let i = 0; i < count; i += 1) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.left = `${x}px`;
          particle.style.bottom = `${y}px`;
          particle.style.background = paletteColor(level + i, i * 9);
          particle.style.setProperty('--dx', `${(Math.random() - 0.5) * 60}px`);
          particle.style.setProperty('--dy', `${Math.random() * 80 + 20}px`);
          particle.addEventListener('animationend', () => {
            particle.remove();
          });
          gameArea.appendChild(particle);
        }
      }

      function popScore() {
        if (prefersReducedMotion) {
          return;
        }
        scoreEl.classList.remove('score-pop');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('score-pop');
      }

      function shakeScreen() {
        if (prefersReducedMotion) {
          return;
        }
        gameArea.classList.remove('shake');
        // Force reflow so shake animation restarts on consecutive slices.
        void gameArea.offsetWidth;
        gameArea.classList.add('shake');
      }

      function triggerHaptic(pattern) {
        if ('vibrate' in navigator) {
          navigator.vibrate(pattern);
        }
      }

      function ensureAudio() {
        if (!audioState.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) {
            return;
          }
          audioState.ctx = new AudioContext();
          audioState.master = audioState.ctx.createGain();
          audioState.master.gain.value = AUDIO_MASTER_GAIN;
          audioState.master.connect(audioState.ctx.destination);
        }

        if (audioState.ctx && audioState.ctx.state === 'suspended') {
          audioState.ctx.resume();
        }
      }

      function playTone({ type = 'sine', frequency = 440, duration = 0.12 }) {
        ensureAudio();
        if (!audioState.ctx || !audioState.master) {
          return;
        }

        const now = audioState.ctx.currentTime;
        const oscillator = audioState.ctx.createOscillator();
        const gain = audioState.ctx.createGain();
        const feverBoost = state.feverActive ? 120 : 0;

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(
          frequency + state.score * FREQUENCY_SCORE_MULTIPLIER + feverBoost,
          now
        );
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        oscillator.connect(gain);
        gain.connect(audioState.master);
        oscillator.start(now);
        oscillator.stop(now + duration);
      }

      function playSound(kind) {
        const soundMap = {
          perfect: { frequency: 520, duration: 0.12, type: 'sine' },
          slice: { frequency: 360, duration: 0.15, type: 'triangle' },
          miss: { frequency: 220, duration: 0.22, type: 'sawtooth' },
          fever: { frequency: 720, duration: 0.18, type: 'square' },
        };
        const config = soundMap[kind];
        if (config) {
          playTone(config);
        }
      }

      function measure() {
        state.dimensions.width = gameArea.clientWidth;
        state.dimensions.height = gameArea.clientHeight;
      }

      function nextBlock() {
        const prev = state.stack[state.stack.length - 1];
        const width = prev ? prev.width : state.dimensions.width * 0.7;
        const y = state.stack.length * state.blockHeight;

        if (y + state.blockHeight > state.dimensions.height) {
          endGame('Tower reached the top. Nice run!');
          return;
        }

        state.current = {
          x: 0,
          y,
          width,
          speed: Math.min(180 + state.stack.length * 8, MAX_BLOCK_SPEED),
          dir: 1,
          el: null,
        };

        createBlockElement(state.current, state.stack.length + 1);
      }

      function resetGameBoard() {
        gameArea.innerHTML = '';
        state.stack = [];
        state.score = 0;
        state.current = null;
        scoreEl.textContent = '0';
        updateBackground();
      }

      function endGame(text) {
        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem('pss-best', String(state.best));
          bestEl.textContent = String(state.best);
        }
        state.perfectStreak = 0;
        state.feverActive = false;
        state.feverEndsAt = 0;
        gameShell.classList.remove('fever');
        gameArea.classList.remove('fever');
        setState(GameStates.GAME_OVER, { message: text });
      }

      function dropCurrentBlock() {
        if (!state.running || !state.current) {
          return;
        }

        ensureAudio();
        const prev = state.stack[state.stack.length - 1];
        const current = state.current;

        const left = Math.max(prev.x, current.x);
        const right = Math.min(prev.x + prev.width, current.x + current.width);
        const overlap = right - left;

        if (overlap <= 0) {
          triggerHaptic(HAPTIC_IMPACT_PATTERN);
          playSound('miss');
          shakeScreen();
          endGame('Missed! Press Start to try again.');
          return;
        }

        const sliced = overlap < current.width - 0.5;
        current.x = left;
        current.width = overlap;
        current.el.style.left = `${current.x}px`;
        current.el.style.width = `${current.width}px`;

        state.stack.push(current);
        state.current = null;
        state.score = state.stack.length - 1;
        scoreEl.textContent = String(state.score);
        popScore();
        updateBackground();

        burstParticles(
          current.x + current.width / 2,
          current.y + state.blockHeight / 2,
          state.stack.length
        );

        if (sliced) {
          state.perfectStreak = 0;
          shakeScreen();
          triggerHaptic(HAPTIC_IMPACT_PATTERN);
          playSound('slice');
          setMessage('Sliced! Keep balancing.');
        } else {
          state.perfectStreak += 1;
          triggerHaptic(HAPTIC_IMPACT_PATTERN);
          playSound('perfect');
          setMessage('Perfect drop!');
        }

        if (state.perfectStreak >= FEVER_STREAK && !state.feverActive) {
          startFever();
        }
        nextBlock();
      }

      function moveCurrentBlock(time) {
        try {
          if (!state.running || !state.current) {
            return;
          }

          if (!state.lastTime) {
            state.lastTime = time;
          }

          const delta = Math.min((time - state.lastTime) / 1000, MAX_DELTA_SECONDS);
          state.lastTime = time;

          const maxX = state.dimensions.width - state.current.width;
          state.current.x += state.current.speed * delta * state.current.dir;

          if (state.current.x <= 0) {
            state.current.x = 0;
            state.current.dir = 1;
          } else if (state.current.x >= maxX) {
            state.current.x = maxX;
            state.current.dir = -1;
          }

          state.current.el.style.left = `${state.current.x}px`;
        } catch (error) {
          console.error('Game loop error:', error);
          setState(GameStates.GAME_OVER, { message: 'Unexpected error. Press Start to reset.' });
        }
      }

      function ensureLoop() {
        if (state.animationId) {
          return;
        }
        state.lastTime = 0;
        state.animationId = requestAnimationFrame(loop);
      }

      function loop(time) {
        const handler = stateHandlers[state.gameState];
        if (handler) {
          handler.update(time);
          handler.draw();
        }

        if (state.gameState === GameStates.PLAYING || state.gameState === GameStates.LEVEL_UP) {
          state.animationId = requestAnimationFrame(loop);
        } else {
          state.animationId = 0;
        }
      }

      function startFever() {
        state.feverActive = true;
        state.feverEndsAt = performance.now() + FEVER_DURATION;
        state.perfectStreak = 0;
        playSound('fever');
        setState(GameStates.LEVEL_UP);
      }

      function endFever() {
        state.feverActive = false;
        gameShell.classList.remove('fever');
        gameArea.classList.remove('fever');
        setMessage('Fever over. Keep stacking!');
        setState(GameStates.PLAYING);
      }

      const stateHandlers = {
        [GameStates.MENU]: {
          enter() {
            state.running = false;
            cancelAnimationFrame(state.animationId);
            state.animationId = 0;
            setMessage('Press Start to begin.');
            startBtn.textContent = 'Start Game';
            gameShell.classList.remove('fever');
            gameArea.classList.remove('fever');
          },
          update() {},
          draw() {},
        },
        [GameStates.PLAYING]: {
          enter(options = {}) {
            state.running = true;
            if (options.reset) {
              measure();
              resetGameBoard();
              state.lastTime = 0;
              state.perfectStreak = 0;
              state.feverActive = false;
              state.feverEndsAt = 0;
              gameShell.classList.remove('fever');
              gameArea.classList.remove('fever');

              const base = {
                x: state.dimensions.width * 0.15,
                y: 0,
                width: state.dimensions.width * 0.7,
                el: null,
              };

              createBlockElement(base, 0);
              state.stack.push(base);
              nextBlock();
              setMessage('Stack perfectly for maximum score.');
              gameArea.focus();
            }
            startBtn.textContent = 'Restart';
            ensureLoop();
          },
          update(time) {
            moveCurrentBlock(time);
          },
          draw() {},
        },
        [GameStates.LEVEL_UP]: {
          enter() {
            state.running = true;
            gameShell.classList.add('fever');
            gameArea.classList.add('fever');
            startBtn.textContent = 'Restart';
            setMessage('Fever mode! Keep the streak alive.');
            ensureLoop();
          },
          update(time) {
            moveCurrentBlock(time);
            if (performance.now() >= state.feverEndsAt) {
              endFever();
            }
          },
          draw() {},
        },
        [GameStates.GAME_OVER]: {
          enter(options = {}) {
            state.running = false;
            cancelAnimationFrame(state.animationId);
            state.animationId = 0;
            gameShell.classList.remove('fever');
            gameArea.classList.remove('fever');
            if (options.message) {
              setMessage(options.message, true);
            }
            startBtn.textContent = 'Restart';
          },
          update() {},
          draw() {},
        },
      };

      function setState(nextState, options = {}) {
        if (state.gameState === nextState && !options.reset) {
          return;
        }

        const currentHandler = stateHandlers[state.gameState];
        if (currentHandler && currentHandler.exit) {
          currentHandler.exit();
        }

        state.gameState = nextState;
        const nextHandler = stateHandlers[nextState];
        if (nextHandler && nextHandler.enter) {
          nextHandler.enter(options);
          nextHandler.draw();
        }
      }

      const activateDrop = () => {
        dropCurrentBlock();
      };

      gameArea.addEventListener('pointerdown', activateDrop);
      gameArea.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activateDrop();
        }
      });

      startBtn.addEventListener('click', () => {
        ensureAudio();
        setState(GameStates.PLAYING, { reset: true });
      });
      window.addEventListener('resize', () => {
        if (!state.running) {
          measure();
        }
      });

      setState(GameStates.MENU);
    })();
  </script>
</body>
</html>
