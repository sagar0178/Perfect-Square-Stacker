<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfect Square Stacker</title>
  <style>
    :root {
      --bg-hue: 230;
      --panel: #111325;
      --text: #f1f4ff;
      --accent: #5df2ff;
      --danger: #ff5da2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 10%, hsl(var(--bg-hue) 70% 22%), #07070f 65%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: background 0.35s ease;
      padding: 16px;
    }

    .game-shell {
      width: min(94vw, 390px);
      background: color-mix(in oklab, var(--panel), black 12%);
      border: 1px solid #2f355f;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 14px 36px rgb(0 0 0 / 45%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .scores {
      display: flex;
      gap: 12px;
      font-size: 0.96rem;
    }

    .scores strong { color: var(--accent); }

    button {
      border: 1px solid #36408a;
      border-radius: 9px;
      padding: 8px 12px;
      color: var(--text);
      background: linear-gradient(180deg, #252f66, #19204a);
      cursor: pointer;
      font-weight: 700;
    }

    button:focus-visible,
    .game-area:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .game-area {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 5;
      border-radius: 12px;
      border: 1px solid #2e3260;
      background: linear-gradient(180deg, rgb(21 23 42 / 92%), rgb(11 12 24 / 98%));
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-area.shake {
      animation: shake 0.18s linear;
    }

    .block {
      position: absolute;
      height: 32px;
      border-radius: 6px 6px 0 0;
      box-shadow: 0 0 14px rgb(93 242 255 / 34%);
    }

    .message {
      min-height: 1.3em;
      text-align: center;
      color: #b7beff;
      font-size: 0.95rem;
    }

    .hint {
      margin: 0;
      text-align: center;
      color: #a9afd8;
      font-size: 0.85rem;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <div class="hud">
      <div class="scores" aria-label="scoreboard">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <button id="startBtn" type="button" aria-label="Start or restart game">Start Game</button>
    </div>

    <section
      id="gameArea"
      class="game-area"
      role="application"
      aria-label="Perfect Square Stacker game area. Tap, click, Enter, or Space to drop the moving block."
      tabindex="0"
    ></section>

    <p id="message" class="message" aria-live="polite">Press Start to begin.</p>
    <p class="hint">Tap/click game area (or press Enter/Space) to drop each block.</p>
  </main>

  <script>
    (() => {
      'use strict';

      const gameArea = document.getElementById('gameArea');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const messageEl = document.getElementById('message');
      const startBtn = document.getElementById('startBtn');

      const state = {
        running: false,
        animationId: 0,
        lastTime: 0,
        score: 0,
        best: Number(localStorage.getItem('pss-best') || 0),
        stack: [],
        current: null,
        dimensions: { width: 0, height: 0 },
        blockHeight: 32,
      };

      bestEl.textContent = String(state.best);

      function setMessage(text, isError = false) {
        messageEl.textContent = text;
        messageEl.style.color = isError ? 'var(--danger)' : '#b7beff';
      }

      function updateBackground() {
        const hue = (230 + state.score * 11) % 360;
        document.documentElement.style.setProperty('--bg-hue', String(hue));
      }

      function randomBlockColor(level) {
        const hue = (190 + level * 16) % 360;
        return `hsl(${hue} 90% 62%)`;
      }

      function createBlockElement(block, level) {
        const el = document.createElement('div');
        el.className = 'block';
        el.style.width = `${block.width}px`;
        el.style.left = `${block.x}px`;
        el.style.bottom = `${block.y}px`;
        el.style.background = randomBlockColor(level);
        gameArea.appendChild(el);
        block.el = el;
      }

      function shakeScreen() {
        gameArea.classList.remove('shake');
        void gameArea.offsetWidth;
        gameArea.classList.add('shake');
      }

      function measure() {
        state.dimensions.width = gameArea.clientWidth;
        state.dimensions.height = gameArea.clientHeight;
      }

      function nextBlock() {
        const prev = state.stack[state.stack.length - 1];
        const width = prev ? prev.width : state.dimensions.width * 0.7;
        const y = state.stack.length * state.blockHeight;

        if (y + state.blockHeight > state.dimensions.height) {
          endGame('Tower reached the top. Nice run!');
          return;
        }

        state.current = {
          x: 0,
          y,
          width,
          speed: 180 + state.stack.length * 8,
          dir: 1,
          el: null,
        };

        createBlockElement(state.current, state.stack.length + 1);
      }

      function resetGameBoard() {
        gameArea.innerHTML = '';
        state.stack = [];
        state.score = 0;
        scoreEl.textContent = '0';
        updateBackground();
      }

      function startGame() {
        measure();
        resetGameBoard();
        setMessage('Stack perfectly for maximum score.');
        state.running = true;
        state.lastTime = 0;

        const base = {
          x: state.dimensions.width * 0.15,
          y: 0,
          width: state.dimensions.width * 0.7,
          el: null,
        };

        createBlockElement(base, 0);
        state.stack.push(base);
        nextBlock();

        cancelAnimationFrame(state.animationId);
        state.animationId = requestAnimationFrame(loop);
        gameArea.focus();
      }

      function endGame(text) {
        state.running = false;
        cancelAnimationFrame(state.animationId);

        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem('pss-best', String(state.best));
          bestEl.textContent = String(state.best);
        }

        setMessage(text, true);
      }

      function dropCurrentBlock() {
        if (!state.running || !state.current) {
          return;
        }

        const prev = state.stack[state.stack.length - 1];
        const current = state.current;

        const left = Math.max(prev.x, current.x);
        const right = Math.min(prev.x + prev.width, current.x + current.width);
        const overlap = right - left;

        if (overlap <= 0) {
          endGame('Missed! Press Start to try again.');
          return;
        }

        const sliced = overlap < current.width - 0.5;
        current.x = left;
        current.width = overlap;
        current.el.style.left = `${current.x}px`;
        current.el.style.width = `${current.width}px`;

        state.stack.push(current);
        state.current = null;
        state.score = state.stack.length - 1;
        scoreEl.textContent = String(state.score);
        updateBackground();

        if (sliced) {
          shakeScreen();
        }

        setMessage(sliced ? 'Sliced! Keep balancing.' : 'Perfect drop!');
        nextBlock();
      }

      function loop(time) {
        try {
          if (!state.running || !state.current) {
            return;
          }

          if (!state.lastTime) {
            state.lastTime = time;
          }

          const delta = Math.min((time - state.lastTime) / 1000, 0.033);
          state.lastTime = time;

          const maxX = state.dimensions.width - state.current.width;
          state.current.x += state.current.speed * delta * state.current.dir;

          if (state.current.x <= 0) {
            state.current.x = 0;
            state.current.dir = 1;
          } else if (state.current.x >= maxX) {
            state.current.x = maxX;
            state.current.dir = -1;
          }

          state.current.el.style.left = `${state.current.x}px`;
          state.animationId = requestAnimationFrame(loop);
        } catch (error) {
          state.running = false;
          console.error('Game loop error:', error);
          setMessage('Unexpected error. Press Start to reset.', true);
        }
      }

      const activateDrop = (event) => {
        if (event && event.cancelable) {
          event.preventDefault();
        }
        dropCurrentBlock();
      };

      gameArea.addEventListener('click', activateDrop, { passive: false });
      gameArea.addEventListener('touchstart', activateDrop, { passive: false });
      gameArea.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          activateDrop(event);
        }
      });

      startBtn.addEventListener('click', startGame);
      window.addEventListener('resize', () => {
        if (!state.running) {
          measure();
        }
      });
    })();
  </script>
</body>
</html>
